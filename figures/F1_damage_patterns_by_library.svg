<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="t1 d1">
  <title id="t1">Schematic damage patterns by library type and UDG treatment</title>
  <desc id="d1">Original schematic for grapevine-adna chapter 2. Double-stranded libraries typically show C-to-T at the 5-prime end and G-to-A at the 3-prime end; single-stranded libraries show C-to-T at both ends; UDG-half typically leaves residual terminal damage. Plant CG/CHG/CHH residual damage after full UDG is not drawn, because this addition did not open a plant source for that claim.</desc>
  <rect width="920" height="420" fill="#fbfaf6"/>
  <text x="460" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16">Damage patterns by library type (schematic, not a measured grape profile)</text>
  <text x="460" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#444">Opened Briggs and Rohland abstracts support damage at molecule ends. The library-type panels are schematic and [待确认]. Not a result we generated.</text>

  <!-- panel 1 ds -->
  <rect x="24" y="70" width="280" height="280" fill="#fff" stroke="#333"/>
  <text x="164" y="94" text-anchor="middle" font-family="Georgia, serif" font-size="13">Double-stranded library</text>
  <text x="164" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#444">typical: 5' C-to-T, 3' G-to-A</text>
  <line x1="50" y1="200" x2="278" y2="200" stroke="#222" stroke-width="3"/>
  <polygon points="50,200 70,188 70,212" fill="#c0392b"/>
  <text x="88" y="186" font-family="Georgia, serif" font-size="11" fill="#c0392b">5' C-to-T</text>
  <polygon points="278,200 258,188 258,212" fill="#2471a3"/>
  <text x="198" y="226" font-family="Georgia, serif" font-size="11" fill="#2471a3">3' G-to-A</text>
  <text x="164" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#555">Pattern by library type [待确认]</text>

  <!-- panel 2 ss -->
  <rect x="320" y="70" width="280" height="280" fill="#fff" stroke="#333"/>
  <text x="460" y="94" text-anchor="middle" font-family="Georgia, serif" font-size="13">Single-stranded library</text>
  <text x="460" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#444">typical: C-to-T at both ends</text>
  <line x1="346" y1="200" x2="574" y2="200" stroke="#222" stroke-width="3"/>
  <polygon points="346,200 366,188 366,212" fill="#c0392b"/>
  <polygon points="574,200 554,188 554,212" fill="#c0392b"/>
  <text x="380" y="186" font-family="Georgia, serif" font-size="11" fill="#c0392b">5' C-to-T</text>
  <text x="500" y="226" font-family="Georgia, serif" font-size="11" fill="#c0392b">3' C-to-T</text>
  <text x="460" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#555">Pattern by library type [待确认]</text>

  <!-- panel 3 udg-half -->
  <rect x="616" y="70" width="280" height="280" fill="#fff" stroke="#333"/>
  <text x="756" y="94" text-anchor="middle" font-family="Georgia, serif" font-size="13">UDG-half treatment</text>
  <text x="756" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#444">typical: residual terminal damage (1–2 bases [待确认])</text>
  <line x1="642" y1="200" x2="870" y2="200" stroke="#222" stroke-width="3"/>
  <rect x="642" y="190" width="18" height="20" fill="#e67e22" opacity="0.85"/>
  <rect x="852" y="190" width="18" height="20" fill="#e67e22" opacity="0.85"/>
  <text x="756" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#e67e22">terminal residual only (schematic)</text>
  <text x="756" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#555">Rohland catalog entry; grape trim length [待确认]</text>
  <text x="756" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#555">Full-UDG plant CG/CHG/CHH not drawn</text>
</svg>
